name: Bug 报告
description: 统计不对、插件不工作、上报失败等
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先看 `plugin/README.md` 的「日志与远程排障」一节。
        ⚠️ 日志与 `report-data.json` 含你的**文件路径与听歌记录**，公开贴出前请先脱敏（令牌、内网地址、用户名）。
  - type: input
    id: versions
    attributes:
      label: 版本
      description: 插件版本 + Salt Player 版本 + 系统
      placeholder: "插件 1.0.0 / SPW 1.18.5 / Windows 11"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 现象与期望
      description: 发生了什么？你期望是什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开设置 → 创意工坊 → 模组管理 → 听歌统计
        2. 点「查看统计摘要」
        3. …
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 插件配置页点「输出诊断信息」，然后把 listenstats.log 里相关片段贴上来（**已脱敏**）
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已升级到最新版本再复现
          required: true
        - label: 我已删除日志/截图中的令牌、内网地址与个人路径
          required: true
