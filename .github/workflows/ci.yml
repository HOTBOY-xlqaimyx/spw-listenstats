name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    name: 构建 + 纯逻辑自测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('plugin/**/*.gradle.kts', 'plugin/gradle/libs.versions.toml', 'plugin/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: 自测（不依赖宿主的纯逻辑检查）
        working-directory: plugin
        run: ./gradlew --no-daemon --console=plain selftest

      - name: 打包插件
        working-directory: plugin
        run: ./gradlew --no-daemon --console=plain plugin

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ListenStats-plugin
          path: plugin/build/dist/*.zip
          if-no-files-found: error
