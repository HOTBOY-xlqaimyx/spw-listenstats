<!doctype html>
<!-- 听歌统计报告页 v0.4.1 · 两种数据源：
     ① 本地报告（默认形态）：数据内联在 <script id="spw-inline-data"> 里，由插件自动刷新，双击即可看，零依赖；
     ② 在线页（可选扩展）：同源 fetch ./report-data.json（由 spw-receiver 生成）-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>听歌统计</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --fg:#14161a; --dim:#6b7280; --line:#e8eaee;
    --track:#f0f1f4; --shadow:0 2px 10px rgba(20,22,26,.05); --hero-shadow:0 10px 30px rgba(124,92,255,.25);
    --chip:#f2f3f6; --c1:#7c5cff; --c2:#ff7ac6; --c3:#34d399; --c4:#60a5fa;
    --warn:#f59e0b; --bad:#ef4444; --qrbg:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0e0f12; --card:#17181c; --fg:#e9eaf0; --dim:#98a0ad; --line:#25272e;
      --track:#23252c; --shadow:0 2px 12px rgba(0,0,0,.35); --hero-shadow:0 10px 30px rgba(0,0,0,.45);
      --chip:#23252c; --c1:#8b74ff; --c2:#ff86cd;
      --warn:#fbbf24; --bad:#f87171; --qrbg:#e9eaf0;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0e0f12; --card:#17181c; --fg:#e9eaf0; --dim:#98a0ad; --line:#25272e;
    --track:#23252c; --shadow:0 2px 12px rgba(0,0,0,.35); --hero-shadow:0 10px 30px rgba(0,0,0,.45);
    --chip:#23252c; --c1:#8b74ff; --c2:#ff86cd;
    --warn:#fbbf24; --bad:#f87171; --qrbg:#e9eaf0;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--fg);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;transition:background .25s ease,color .25s ease}
  .wrap{max-width:880px;margin:0 auto;padding:22px 16px 56px;position:relative}
  /* 切换按钮浮在渐变卡片上：半透明玻璃片，日夜两套主题下观感一致 */
  .theme,.refresh{position:absolute;top:34px;z-index:5;width:34px;height:34px;border-radius:11px;
    border:1px solid rgba(255,255,255,.38);background:rgba(255,255,255,.22);color:#fff;font-size:15px;line-height:1;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    -webkit-tap-highlight-color:transparent;transition:background .2s ease}
  .theme{right:28px}
  .refresh{right:70px;font-size:15px}
  .theme:active,.refresh:active{transform:scale(.96)}
  .refresh.spin{animation:spin .8s linear}
  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  .hero{background:linear-gradient(135deg,var(--c1),var(--c2));border-radius:20px;padding:22px 22px 20px;color:#fff;
        box-shadow:var(--hero-shadow);margin-bottom:16px}
  .hero .k{font-size:12px;opacity:.88;margin-bottom:6px}
  .hero .v{font-size:40px;font-weight:700;letter-spacing:.5px;line-height:1.15}
  .hero .v span{font-size:15px;font-weight:500;opacity:.92;margin-left:4px}
  .hero .sub{font-size:12px;opacity:.92;margin-top:10px;display:flex;flex-wrap:wrap;gap:10px;align-items:baseline}
  .hero .sub .fresh{font-weight:600}
  .fresh.ok{color:#eafff6}
  .fresh.warn{color:#fff4d6}
  .fresh.bad{color:#ffe0e0}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
  .stat{background:var(--card);border-radius:16px;padding:14px 15px;box-shadow:var(--shadow)}
  .stat .k{font-size:12px;color:var(--dim);margin-bottom:6px}
  .stat .v{font-size:22px;font-weight:650}
  section{background:var(--card);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
  h2{margin:0 0 14px;font-size:14px;font-weight:650;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  h2 em{font-style:normal;font-size:12px;color:var(--dim);font-weight:400;white-space:nowrap}
  /* 时间范围：胶囊分段控件 */
  .seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px;gap:2px}
  .seg button{appearance:none;border:0;background:transparent;color:var(--dim);font:inherit;font-size:12px;
    padding:5px 11px;border-radius:8px;cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap}
  .seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);font-weight:600;box-shadow:var(--shadow)}
  .bars{display:flex;flex-direction:column;gap:11px}
  .bar{display:grid;grid-template-columns:52px 1fr 60px;gap:10px;align-items:center}
  .bar .lab{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
  .bar .track{height:10px;background:var(--track);border-radius:99px;overflow:hidden}
  .bar .track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--c1),var(--c2))}
  .bar .val{font-size:12px;text-align:right;font-variant-numeric:tabular-nums;color:var(--fg)}
  .arow .atop{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px}
  .arow .aname{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .arow .aval{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
  .arow .track{height:10px;background:var(--track);border-radius:99px;overflow:hidden}
  .arow .track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--c3),var(--c4))}
  ol.tracks{list-style:none;margin:0;padding:0}
  ol.tracks li{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  ol.tracks li:last-child{border-bottom:0}
  .rank{width:26px;height:26px;border-radius:9px;background:var(--chip);color:var(--dim);font-size:12px;
        display:flex;align-items:center;justify-content:center;font-weight:600}
  ol.tracks li:nth-child(1) .rank{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff}
  ol.tracks li:nth-child(2) .rank{background:color-mix(in srgb,var(--c1) 18%,transparent);color:var(--c1)}
  ol.tracks li:nth-child(3) .rank{background:color-mix(in srgb,var(--c2) 20%,transparent);color:var(--c2)}
  .meta{min-width:0}
  .meta .t{font-size:14px;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta .s{font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .right{text-align:right;font-variant-numeric:tabular-nums}
  .right .n{font-size:13px;font-weight:550}
  .right .x{font-size:11px;color:var(--dim)}
  /* 曲目榜工具条：搜索 + 展开全部 */
  .tools{display:flex;gap:10px;align-items:center;margin:0 0 12px}
  .tools input{flex:1;min-width:0;background:var(--chip);border:1px solid transparent;color:var(--fg);
    border-radius:10px;padding:8px 11px;font:inherit;font-size:13px;outline:none;-webkit-appearance:none}
  .tools input:focus{border-color:color-mix(in srgb,var(--c1) 55%,transparent)}
  .tools button{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--fg);
    border-radius:10px;padding:7px 12px;font:inherit;font-size:12px;cursor:pointer;white-space:nowrap}
  .tools button:active{transform:scale(.98)}
  .hint{font-size:11.5px;color:var(--dim);margin-top:10px;line-height:1.6}
  /* 最近播放：时间列比名次列宽 */
  ol.recent li{grid-template-columns:62px 1fr auto}
  .rank.rt{width:auto;min-width:62px;padding:0 7px;font-size:10.5px;font-weight:600;letter-spacing:.2px}
  ol.recent li:nth-child(n) .rank{background:var(--chip);color:var(--dim)}
  /* 二维码：在线版才显示 */
  .qrbox{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center}
  .qrbox svg{display:block;width:148px;height:148px;background:var(--qrbg);border-radius:12px;padding:8px}
  .qrbox .qt{font-size:12px;color:var(--dim);line-height:1.7;text-align:left;max-width:330px}
  .qrbox .qt b{color:var(--fg);font-weight:600;display:block;font-size:13px;margin-bottom:4px;word-break:break-all}
  footer{color:var(--dim);font-size:12px;text-align:center;line-height:1.7;margin-top:20px}
  .note{background:var(--card);border-radius:14px;padding:11px 14px;box-shadow:var(--shadow);color:var(--dim);
        font-size:12px;line-height:1.65;margin:-4px 0 14px}
  .note b{color:var(--fg);font-weight:600}
  .empty{background:var(--card);border-radius:16px;padding:30px 20px;box-shadow:var(--shadow);color:var(--dim);
         font-size:13px;line-height:1.9;text-align:center}
  @media (max-width:640px){
    .wrap{padding:14px 12px 44px}
    .theme{top:28px;right:26px;width:32px;height:32px;border-radius:10px}
    .refresh{top:28px;right:64px;width:32px;height:32px;border-radius:10px}
    .hero{padding:18px;border-radius:18px}
    .hero .v{font-size:32px}
    .grid{grid-template-columns:repeat(3,1fr);gap:9px}
    .stat{padding:12px;border-radius:14px}
    .stat .v{font-size:18px}
    section{padding:15px;border-radius:14px}
    .bar{grid-template-columns:42px 1fr 52px;gap:8px}
    ol.tracks li{grid-template-columns:26px 1fr auto;gap:10px}
    .note{padding:10px 12px;border-radius:13px}
    .seg button{padding:5px 9px;font-size:11.5px}
    .qrbox svg{width:132px;height:132px}
    .qrbox .qt{text-align:center}
  }
</style>
</head>
<body>
<div class="wrap">
  <button class="refresh" id="refresh" type="button" aria-label="刷新数据" title="刷新数据">⟳</button>
  <button class="theme" id="theme" type="button" aria-label="切换夜间模式">🌙</button>

  <div id="main">
    <div class="hero">
      <div class="k">累计收听（自 <span id="h-from">–</span>）</div>
      <div class="v" id="h-total">–</div>
      <div class="sub">
        <span id="h-sub">–</span>
        <span class="fresh" id="h-fresh"></span>
      </div>
    </div>

    <div class="grid">
      <div class="stat"><div class="k">会话</div><div class="v" id="s-sessions">–</div></div>
      <div class="stat"><div class="k">曲目</div><div class="v" id="s-tracks">–</div></div>
      <div class="stat"><div class="k">天数</div><div class="v" id="s-days">–</div></div>
    </div>

    <div class="note" id="note" hidden></div>

    <section>
      <h2>
        <span>每日时长 <em id="days-sum">–</em></span>
        <span class="seg" id="days-range">
          <button type="button" data-days="7" aria-pressed="false">近 7 天</button>
          <button type="button" data-days="30" aria-pressed="false">近 30 天</button>
          <button type="button" data-days="0" aria-pressed="true">全部</button>
        </span>
      </h2>
      <div class="bars" id="days"></div>
    </section>

    <section>
      <h2>常听艺人 <em>拆分多艺人 · 全量累计</em></h2>
      <div id="artists" style="display:flex;flex-direction:column;gap:13px"></div>
    </section>

    <section>
      <h2>听得最多 <em id="tracks-note">全量累计</em></h2>
      <div class="tools">
        <input id="q" type="search" placeholder="搜曲目或艺人…" autocomplete="off">
        <button type="button" id="toggle-all">展开全部</button>
      </div>
      <ol class="tracks" id="tracks"></ol>
      <div class="hint" id="tracks-hint"></div>
    </section>

    <section id="recentsection" hidden>
      <h2>最近播放 <em id="recent-note">–</em></h2>
      <ol class="tracks recent" id="recent"></ol>
      <div class="hint" id="recent-hint"></div>
      <div class="tools" style="margin:12px 0 0">
        <button type="button" id="recent-toggle">展开全部</button>
      </div>
    </section>

    <section id="qrsection">
      <h2>手机扫码打开</h2>
      <div class="qrbox">
        <!--QR-->
        <div class="qt">
          <b id="qr-url">–</b>
          手机与 NAS 在同一局域网即可打开本页，不用记地址。
        </div>
      </div>
    </section>
  </div>

  <div class="empty" id="empty" hidden></div>

  <footer id="foot"></footer>
</div>

<!-- 离线模式：插件导出的自包含报告会把数据内联在这里（在线版保持为空） -->
<script id="spw-inline-data" type="application/json"></script>

<script>
(function () {
  const root = document.documentElement, KEY = 'spw-report-theme';
  const saved = localStorage.getItem(KEY);
  if (saved === 'dark' || saved === 'light') root.dataset.theme = saved;
  const btn = document.getElementById('theme');
  const sysDark = () => window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const isDark = () => root.dataset.theme === 'dark' || (!root.dataset.theme && sysDark());
  const paint = () => {
    btn.textContent = isDark() ? '☀️' : '🌙';
    btn.setAttribute('aria-label', isDark() ? '切换到日间模式' : '切换到夜间模式');
  };
  btn.addEventListener('click', () => {
    const next = isDark() ? 'light' : 'dark';
    root.dataset.theme = next;
    localStorage.setItem(KEY, next);
    paint();
  });
  if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paint);
  paint();
})();

const fmtDur = s => {
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60);
  return h ? h + '<span>小时</span>' + m + '<span>分</span>' : m + '<span>分</span>';
};
const mmss = s => Math.floor(s/60) + ':' + String(Math.round(s%60)).padStart(2,'0');
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const localTime = iso => {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
};
/** 相对时间：用于「最后上报」新鲜度（>30 分钟黄、>2 小时红） */
const ago = iso => {
  if (!iso) return { text:'—', level:'warn' };
  const t = new Date(iso).getTime();
  if (isNaN(t)) return { text: iso, level:'warn' };
  const mins = (Date.now() - t) / 60000;
  const text = mins < 1 ? '刚刚' : mins < 60 ? Math.round(mins) + ' 分钟前'
    : mins < 48*60 ? Math.round(mins/60) + ' 小时前' : Math.round(mins/1440) + ' 天前';
  return { text, level: mins <= 30 ? 'ok' : mins <= 120 ? 'warn' : 'bad' };
};

/** 会话时间：MM-DD HH:mm */
const shortTime = iso => {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return '—';
  const p = n => String(n).padStart(2,'0');
  return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
};
const REASON = {
  ended:'听完了', trackChanged:'切歌', paused:'暂停', idle:'空闲断开', idleState:'停止',
  checkpoint:'分段', pluginStop:'退出', pluginDelete:'插件移除', unknown:'未知'
};
const reasonText = r => REASON[r] || r || '';

function empty(html) {
  document.getElementById('main').hidden = true;
  const box = document.getElementById('empty');
  box.hidden = false;
  box.innerHTML = html;
}

// ---------------- 状态 ----------------
const state = { days: 0, expanded: false, query: '', recentExpanded: false };
let DATA = null;
let INLINE = false;

// ---------------- 渲染 ----------------
function render(d) {
  const t = d.totals, cov = d.coverage || {};
  const unattributed = Number(t.unattributedSeconds || 0);

  document.getElementById('h-from').textContent = d.range.from || '—';
  document.getElementById('h-total').innerHTML = fmtDur(t.listenedSeconds);
  document.getElementById('h-sub').textContent =
    `${d.range.from} ~ ${d.range.to} · ${t.sessions} 次会话 · ${t.tracks} 首曲目`;

  const fresh = document.getElementById('h-fresh');
  if (INLINE) {
    fresh.className = 'fresh ok';
    fresh.textContent = '本地报告';
  } else {
    const f = ago(d.lastReceivedAt);
    fresh.className = 'fresh ' + f.level;
    fresh.textContent = '最后上报 ' + f.text + (f.level === 'bad' ? '（上报可能已断开）' : '');
  }

  document.getElementById('s-sessions').textContent = t.sessions;
  document.getElementById('s-tracks').textContent = t.tracks;
  document.getElementById('s-days').textContent = d.range.days;

  if (cov.full === false) {
    const note = document.getElementById('note');
    note.hidden = false;
    note.innerHTML = `曲目榜与艺人榜目前只覆盖<b>开启上报之后</b>的 ${cov.sessionsReported || 0} 次会话` +
      `（累计 ${cov.sessionsTotal || t.sessions} 次）—— 本批次来自插件 ` +
      `<b>${esc(d.pluginVersion || '未知版本')}</b>。升级到 0.5.0 后重开软件，` +
      `插件会把<b>全量逐曲目历史</b>一起上报，这里自动补全。<br>` +
      `总时长 / 每日时长 / 会话数 / 曲目数<b>已经是全量</b>（来自插件本地累计统计）。`;
  }

  renderDays();
  renderArtists();
  renderTracks();
  renderRecent();
  renderFooter(d, unattributed);
  if (INLINE) document.getElementById('qrsection').hidden = true;
  else if (!document.querySelector('#qrsection svg')) document.getElementById('qrsection').hidden = true;
}

function renderDays() {
  const d = DATA;
  let rows = d.daily.slice();
  if (state.days > 0) {
    const cut = new Date(Date.now() - state.days * 86400000);
    const from = cut.getFullYear() + '-' + String(cut.getMonth()+1).padStart(2,'0') + '-' +
                 String(cut.getDate()).padStart(2,'0');
    rows = rows.filter(x => x.date >= from);
  }
  const total = rows.reduce((a, x) => a + x.seconds, 0);
  document.getElementById('days-sum').textContent =
    (state.days > 0 ? `近 ${state.days} 天` : '全部') + '合计 ' + Math.round(total/60) + ' 分';
  const max = Math.max(1, ...rows.map(x => x.seconds));
  document.getElementById('days').innerHTML = rows.map(x => `
    <div class="bar">
      <div class="lab">${esc(x.date.slice(5))}</div>
      <div class="track"><i style="width:${x.seconds/max*100}%"></i></div>
      <div class="val">${Math.round(x.seconds/60)} 分</div>
    </div>`).join('') || '<div style="color:var(--dim);font-size:12px">该区间没有数据</div>';
}

function renderArtists() {
  const d = DATA;
  const maxA = d.artists.length ? d.artists[0].seconds : 1;
  document.getElementById('artists').innerHTML = d.artists.slice(0,8).map(a => `
    <div class="arow">
      <div class="atop"><span class="aname">${esc(a.name)}</span><span class="aval">${mmss(a.seconds)}</span></div>
      <div class="track"><i style="width:${a.seconds/maxA*100}%"></i></div>
    </div>`).join('') || '<div style="color:var(--dim);font-size:12px">暂无</div>';
}

function renderTracks() {
  const d = DATA;
  const q = state.query.trim().toLowerCase();
  let list = d.tracks;
  if (q) {
    list = list.filter(x => (x.title + ' ' + (x.artist || '') + ' ' + (x.album || '')).toLowerCase().includes(q));
  }
  const limit = q ? 50 : (state.expanded ? list.length : 10);
  document.getElementById('tracks').innerHTML = list.slice(0, limit).map((x, i) => `
    <li>
      <div class="rank">${i+1}</div>
      <div class="meta">
        <div class="t">${esc(x.title)}</div>
        <div class="s">${esc(x.artist) || '—'}${x.album ? ' · ' + esc(x.album) : ''}</div>
      </div>
      <div class="right"><div class="n">${mmss(x.seconds)}</div><div class="x">×${x.sessions}</div></div>
    </li>`).join('') || '<li style="color:var(--dim);font-size:12px;border:0">没有匹配的曲目</li>';

  const btn = document.getElementById('toggle-all');
  btn.hidden = !!q || list.length <= 10;
  btn.textContent = state.expanded ? '只看 Top 10' : `展开全部（${list.length}）`;
  document.getElementById('tracks-note').textContent = q ? `匹配 ${list.length} 首` : '全量累计';
  document.getElementById('tracks-hint').textContent = q
    ? '搜索范围：曲目名 / 艺人 / 专辑；最多显示 50 条。'
    : (list.length > 10 ? `共 ${list.length} 首，点「展开全部」看完整榜单。` : '');
}

function renderRecent() {
  const list = DATA.recentSessions || [];
  const sec = document.getElementById('recentsection');
  if (!list.length) { sec.hidden = true; return; }
  sec.hidden = false;
  const limit = state.recentExpanded ? list.length : 8;
  document.getElementById('recent-note').textContent =
    `最近 ${list.length} 条会话（逐条明细）`;
  document.getElementById('recent').innerHTML = list.slice(0, limit).map(s => `
    <li>
      <div class="rank rt">${esc(shortTime(s.startedAtIso))}</div>
      <div class="meta">
        <div class="t">${esc(s.title)}</div>
        <div class="s">${esc(s.artist) || '—'}${s.album ? ' · ' + esc(s.album) : ''}${s.continued ? ' · 分段' : ''}</div>
      </div>
      <div class="right"><div class="n">${mmss(s.seconds)}</div><div class="x">${esc(reasonText(s.endedReason))}</div></div>
    </li>`).join('');
  // 长曲目每 5 分钟被切开一段 —— 同一首歌会连着出现好几条，必须说明，否则看着像重复
  const hasContinued = list.some(s => s.continued);
  const unattributed = list.filter(s => s.title === '未归因').length;
  const notes = [];
  if (hasContinued) notes.push('「分段」= 长曲目按 5 分钟切开的同一首，不是重复播放');
  if (unattributed) notes.push(`其中 ${unattributed} 条是宿主未告知曲目的时段（已计入总量，不进榜单）`);
  document.getElementById('recent-hint').textContent = notes.join('；');
  const btn = document.getElementById('recent-toggle');
  btn.hidden = list.length <= 8;
  btn.textContent = state.recentExpanded ? '收起' : `展开全部（${list.length}）`;
}

function renderFooter(d, unattributed) {
  const qrUrl = document.getElementById('qr-url');
  if (qrUrl && !INLINE) qrUrl.textContent = location.href.split('?')[0];
  document.getElementById('foot').innerHTML =
    (unattributed > 0
      ? `其中<b style="color:var(--fg)">未归因 ${mmss(unattributed)}</b>：宿主未给出曲目信息的那段（如启动时已在播的一首）<br>`
      : '') +
    (INLINE
      ? `本地报告 · 生成于 ${localTime(d.generatedAt)}（数据来自插件本地统计，无需服务器）<br>`
      : `数据来源：${esc(d.source)}<br>最新上报 ${localTime(d.lastReceivedAt)} · 共 ${d.batches} 批次 · ` +
        `插件 ${esc(d.pluginVersion || '?')} · Salt Player ${esc(d.spwVersion || '?')}<br>`) +
    (INLINE
      ? `本地报告每次都会由插件自动重写；浏览器里按 ⟳ 或刷新页面即可看到最新一份<br>`
      : `数据每 60 秒自动刷新一次；也可点右上角 ⟳ 立即刷新<br>`) +
    `页面生成于 ${localTime(d.generatedAt)} · 报告页 v0.4.1 · 设计：变体 B（含夜间模式）`;
}

// ---------------- 交互 ----------------
document.getElementById('days-range').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  state.days = Number(b.dataset.days);
  [...e.currentTarget.querySelectorAll('button')].forEach(x =>
    x.setAttribute('aria-pressed', String(x === b)));
  renderDays();
});
document.getElementById('toggle-all').addEventListener('click', () => {
  state.expanded = !state.expanded;
  renderTracks();
});
// 新鲜度文案是相对时间：每 30 秒重算一次，页面挂着也不会显示过期的「刚刚」
setInterval(() => {
  if (!DATA || INLINE) return;
  const f = ago(DATA.lastReceivedAt);
  const el = document.getElementById('h-fresh');
  el.className = 'fresh ' + f.level;
  el.textContent = '最后上报 ' + f.text + (f.level === 'bad' ? '（上报可能已断开）' : '');
}, 30000);

document.getElementById('recent-toggle').addEventListener('click', () => {
  state.recentExpanded = !state.recentExpanded;
  renderRecent();
});
document.getElementById('q').addEventListener('input', e => {
  state.query = e.target.value;
  renderTracks();
});

// ---------------- 取数：离线内联优先，其次同源 fetch ----------------
function boot(d) {
  if (!d || !d.totals || !d.range) {
    empty('还没有收到任何上报。<br>在插件的「上报」分组里填好地址、打开开关，' +
          '播一首歌后点一次「立即上报」即可看到数据。<br>' +
          '插件的「本地报告」是默认开启的：会话结算后会自动生成一份自带数据的 HTML' +
          '（默认在「我的文档\\SPW听歌统计」），双击就能看。');
    return;
  }
  DATA = d;
  render(d);
}

const AUTO_REFRESH_MS = 60000;   // 在线页自动刷新间隔（仅页面可见时）
let lastLoadAt = 0;
let failedOnce = false;

/** 拉取数据并渲染；[manual] 时给出旋转反馈 */
function load(manual) {
  const btn = document.getElementById('refresh');
  if (manual) { btn.classList.remove('spin'); void btn.offsetWidth; btn.classList.add('spin'); }
  return fetch('./report-data.json?t=' + Date.now(), {cache:'no-store'})
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(d => { lastLoadAt = Date.now(); failedOnce = false; boot(d); })
    .catch(err => {
      if (!DATA) {
        empty(`读取数据失败：${esc(err.message)}<br>请确认 <code>report-data.json</code> 已生成。`);
      } else if (!failedOnce) {
        failedOnce = true;
        console.warn('刷新失败，继续显示上一次的数据：', err.message);
      }
    });
}

const inline = document.getElementById('spw-inline-data');
if (inline && inline.textContent.trim()) {
  INLINE = true;
  try { boot(JSON.parse(inline.textContent)); }
  catch (err) { empty('本地数据解析失败：' + esc(err.message)); }
} else {
  load(false);
  // 定时自动刷新：只在页面可见时拉取，避免后台标签页空跑
  setInterval(() => {
    if (document.visibilityState === 'visible' && Date.now() - lastLoadAt >= AUTO_REFRESH_MS) load(false);
  }, 15000);
  // 从后台切回来时，若数据已过期立刻刷新一次
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && Date.now() - lastLoadAt >= AUTO_REFRESH_MS) load(false);
  });
  window.__spwAutoRefreshMs = AUTO_REFRESH_MS;
}

// 右上角 ⟳：在线页重新拉数据；本地报告则是重新读取磁盘上那份文件
document.getElementById('refresh').addEventListener('click', () => {
  if (INLINE) { location.reload(); return; }
  load(true);
});
</script>
